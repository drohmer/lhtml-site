# What the docs theme declares about the build (lhtml_site/theme.py).
# A documentation site: top bar with search, side menu by section and group,
# "On this page", breadcrumb, previous / next. Its settings are the `docs`
# keyword of the configuration (README of the theme: README.md).
template: 'theme/template/base.html'
content_block: 'content'
toc:
  file: 'js/menu.js'        # receives the table of contents ({{TOC}})
  keys: [section, group]    # the menu groups the pages by these page settings
not_found: 'theme/template/404.html'   # the content of 404.html (with base_url: in configure.yaml)
layout:
  root: '#content article'  # the article, without the menu, the pager and the footer
  exclude: 'nav, footer'
# readable ids for the headings, unique in their page: "When something goes wrong" ->
# when-something-goes-wrong (lhtml_site/headings.py, slug), never one of the ids of the theme
heading_ids:
  scheme: slug
  reserved: [content, sidebar, toc, title_id, site-search, search-results, current-page-id,
             docs-menu-config, docs-strings, not-found-query]
